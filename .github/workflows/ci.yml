name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and package
    # Apple-silicon runner with a current Xcode. Checked against the runner-images README for macos-26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Third-party actions are pinned to a full commit SHA (the tag is in the comment; Dependabot updates both).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build number = commit count

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: scripts/build-app.sh

      - name: Verify the bundle
        run: |
          codesign --verify --deep --strict "dist/Mac Cleaner.app"
          plutil -lint "dist/Mac Cleaner.app/Contents/Info.plist"
          "dist/Mac Cleaner.app/Contents/Resources/bin/mac-cleaner" --version

      - name: Package
        run: scripts/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-cleaner-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
